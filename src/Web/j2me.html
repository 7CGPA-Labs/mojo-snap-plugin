<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mojo Snap Console — Java ME game player powered by CheerpJ">
    <title>Mojo Snap Console — Java ME</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --bg-panel: #111620;
            --accent-color: #c86dd7;
            --accent-hover: #b05ec4;
            --accent-dim: rgba(200, 109, 215, 0.15);
            --text-color: #f0f0f0;
            --text-muted: #8a90a0;
            --border-color: rgba(255,255,255,0.08);
            --glass: rgba(255,255,255,0.05);
            --shadow: 0 8px 32px rgba(0,0,0,0.6);
            --radius: 10px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Top Bar ── */
        #top-bar {
            height: 50px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.6);
            border-bottom: 1px solid var(--border-color);
            z-index: 20;
            flex-shrink: 0;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-color);
            font-size: 13px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.18s, border-color 0.18s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .icon-btn:hover, .icon-btn:focus-visible {
            background: var(--glass);
            border-color: var(--border-color);
            outline: none;
        }

        .icon-btn:active { transform: scale(0.96); }

        .icon-btn.primary {
            background: var(--accent-color);
            color: #fff;
            border-color: transparent;
        }

        .icon-btn.primary:hover, .icon-btn.primary:focus-visible {
            background: var(--accent-hover);
        }

        #game-title {
            flex-grow: 1;
            font-weight: 600;
            font-size: 15px;
            text-align: center;
            opacity: 0.9;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: var(--accent-dim);
            color: var(--accent-color);
            border: 1px solid rgba(200,109,215,0.3);
            padding: 2px 7px;
            border-radius: 20px;
        }

        /* ── Game Panel ── */
        #game-panel {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* CheerpJ mounts its own display element inside #cheerpj-display */
        #cheerpj-display {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ── Loading Screen ── */
        #loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            gap: 20px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }

        .loader-logo {
            font-size: 48px;
            animation: float 2.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .loader-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent-color);
        }

        .loader-status {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'Cascadia Code', 'Consolas', monospace;
            min-height: 18px;
            transition: color 0.3s;
        }

        .loader-status.error { color: #e06060; }

        .progress-bar-wrap {
            width: 280px;
            height: 4px;
            background: rgba(255,255,255,0.07);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-color), #7b68ee);
            border-radius: 99px;
            transition: width 0.3s ease;
        }

        /* ── Error Screen ── */
        #error-screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            gap: 16px;
            z-index: 11;
            padding: 32px;
            text-align: center;
        }

        #error-screen.visible { display: flex; }

        .error-icon { font-size: 48px; }

        .error-title {
            font-size: 18px;
            font-weight: 700;
            color: #e06060;
        }

        #error-message {
            font-size: 13px;
            color: var(--text-muted);
            max-width: 480px;
            line-height: 1.6;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px 16px;
            font-family: monospace;
            word-break: break-word;
        }

        /* ── Overlay Controls ── */
        #game-overlay {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 15;
        }

        #game-overlay.visible { display: flex; }

        .overlay-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.18s, transform 0.1s;
        }

        .overlay-btn:hover { background: rgba(200,109,215,0.3); }
        .overlay-btn:active { transform: scale(0.9); }

        /* Screen reader utility */
        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>

    <header id="top-bar" role="banner">
        <button class="icon-btn" id="btn-exit" aria-label="Exit Game" title="Exit Game">
            <span aria-hidden="true">⬅️</span> Exit
        </button>

        <h1 id="game-title" title="">Mojo Snap Console</h1>
        <span class="badge" aria-label="Java ME runtime">Java ME</span>

        <button class="icon-btn" id="btn-fullscreen" aria-label="Toggle Fullscreen" title="Fullscreen">
            <span aria-hidden="true">⛶</span>
        </button>
        <button class="icon-btn primary" id="btn-focus" aria-label="Focus Game Window">
            <span aria-hidden="true">🎮</span> Play
        </button>
    </header>

    <main id="game-panel" role="main" aria-label="Java ME Game Screen">

        <!-- Loading overlay -->
        <div id="loader" role="status" aria-live="polite">
            <div class="loader-logo" aria-hidden="true">☕</div>
            <div class="loader-title">Loading Java ME Game</div>
            <div class="progress-bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-region">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
            <div class="loader-status" id="loader-status">Initialising runtime…</div>
        </div>

        <!-- Error screen -->
        <div id="error-screen" role="alert" aria-atomic="true">
            <div class="error-icon" aria-hidden="true">⚠️</div>
            <div class="error-title">Launch Failed</div>
            <pre id="error-message"></pre>
            <button class="icon-btn primary" id="btn-retry">↺ Retry</button>
            <button class="icon-btn" id="btn-err-exit">⬅️ Exit</button>
        </div>

        <!-- CheerpJ mount point -->
        <div id="cheerpj-display" aria-label="Java ME Game Display"></div>

        <!-- In-game floating controls -->
        <nav id="game-overlay" aria-label="In-game controls">
            <button class="overlay-btn" id="ovr-pause" title="Pause / Resume" aria-label="Pause or resume game">⏸</button>
            <button class="overlay-btn" id="ovr-menu"  title="Open Menu"       aria-label="Open game menu">☰</button>
            <button class="overlay-btn" id="ovr-save"  title="Save Game"       aria-label="Save game state">💾</button>
        </nav>

    </main>

    <!--
        CheerpJ loader script — bootstraps FreeJ2ME-powered Java ME runtime.
        Loaded dynamically by j2me.js after runtime negotiation so we can pass
        the correct cheerpjRuntime URL without hard-coding it here.
    -->
    <script src="j2me.js?v=1" defer></script>

</body>
</html>
